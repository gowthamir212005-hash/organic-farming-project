<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewellery Shopping</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: url("https://static.vecteezy.com/system/resources/thumbnails/033/259/838/small_2x/space-for-text-on-textured-background-surrounded-by-handmade-and-artisanal-jewelry-background-image-generative-ai-photo.jpg");
            background-size: 100% 100vh;
        }
        .navbar {
            width: 100%;
            background: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .navbar .logo {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        .navbar .nav-links {
            display: flex;
            gap: 15px;
        }
        .navbar .nav-links a {
            text-decoration: none;
            color: #667eea;
            font-weight: bold;
        }
        .navbar .nav-links a:hover {
            color: #5642a6;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-top: 50px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        .btn {
            width: 100%;
            background: #667eea;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background: #5642a6;
        }
        .book-list {
            margin-top: 30px;
            width: 100%;
            max-width: 600px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .book {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .book:last-child {
            border-bottom: none;
        }
        @media (max-width: 480px) {
            .container, .book-list {
                padding: 15px;
            }
            .navbar {
                flex-direction: column;
                align-items: center;
            }
            .navbar .nav-links {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Jewellery Shopping</div>
        <div class="nav-links">
            <a href="/upload">upload</a>
            <a href="/booklist">jewellery</a>
            <a href="/">Logout</a>
        </div>
    </nav>
    
    <!-- Admin Side: Upload Book -->
    <div class="container">
        <h2>Upload Book</h2>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <div class="input-group">
                <label for="book-title">Jewellery Name</label>
                <input type="text" id="book-title" name="title" placeholder="Enter jewellery name" required>
            </div>
            <div class="input-group">
                <label for="author">weight (in gms)</label>
                <input type="text" id="author" name="name" placeholder="Enter jewellery weight" required>
            </div>
            <div class="input-group">
                <label for="price">Price</label>
                <input type="number" id="price" name="price" placeholder="Enter price" required>
            </div>
            <div class="input-group">
                <label for="cover">Jewellery Image</label>
                <input type="file" id="cover" accept="image/*" name="image" required>
            </div>
            <button type="submit" class="btn">Upload Jewellery</button>
        </form>
    </div>
</body>
</html>
