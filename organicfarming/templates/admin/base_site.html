{% extends "admin/base_site.html" %}
{% load static %}

{% block title %}Organic Farm Admin | Dashboard{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
    body {
        background: linear-gradient(180deg, #f6f0e4 0%, #e9e0ce 45%, #d7c5a1 100%) !important;
        color: #1f2a1f !important;
    }

    #header {
        background: #1f3d28 !important;
        box-shadow: 0 10px 30px rgba(18, 53, 36, 0.32);
    }

    #branding #site-name a {
        color: #f9f4e8 !important;
        font-family: 'Lora', Georgia, serif;
        font-size: 1.75rem;
        letter-spacing: 0.02em;
    }

    #user-tools a, #header h1 a {
        color: #f8f2e9 !important;
    }

    #content, #content-main, .module, #nav-sidebar {
        background: rgba(255, 255, 250, 0.96) !important;
        border: 1px solid rgba(171, 139, 80, 0.25) !important;
        box-shadow: 0 18px 35px rgba(18, 53, 36, 0.12) !important;
        border-radius: 18px !important;
    }

    #toolbar {
        background: rgba(255, 255, 247, 0.95) !important;
        border-bottom: 1px solid rgba(171, 139, 80, 0.20) !important;
    }

    .app-list li:hover {
        background: rgba(201, 157, 84, 0.12) !important;
    }

    .module caption {
        color: #2f4f2f !important;
    }

    #footer {
        color: rgba(18, 53, 36, 0.65) !important;
    }

    /* Admin form fields and login page styling */
    #login-form input[type="text"],
    #login-form input[type="password"],
    .module input[type="text"],
    .module input[type="password"],
    .module select,
    .module textarea {
        background: #fbf7ef !important;
        color: #1f2a1f !important;
        border: 1px solid #d7d2c4 !important;
        box-shadow: inset 0 1px 3px rgba(31, 42, 31, 0.12);
        border-radius: 8px !important;
    }

    #login-form input[type="submit"],
    .module input[type="submit"],
    .module button {
        background: linear-gradient(135deg, #f7e6b0, #d8bf8b) !important;
        color: #1f2a1f !important;
        border: 1px solid #b89f6a !important;
        box-shadow: 0 4px 12px rgba(31, 42, 31, 0.18) !important;
    }

    .module label,
    #login-form label {
        color: #1f2a1f !important;
        font-weight: 600 !important;
    }

    .module .form-row, #login-form .form-row {
        margin-bottom: 18px !important;
    }

    /* OrderItem admin list and inline row styling */
    .model-orderitem th.column-product,
    .model-orderitem th.column-quantity,
    .model-orderitem th.column-price,
    .model-orderitem td.field-product,
    .model-orderitem td.field-quantity,
    .model-orderitem td.field-price,
    .inline-related .field-product,
    .inline-related .field-quantity,
    .inline-related .field-price {
        color: #1e4bb8 !important;
    }

    .model-orderitem td.field-product,
    .model-orderitem td.field-quantity,
    .model-orderitem td.field-price {
        font-weight: 600 !important;
    }

    /* Product price color */
td.field-price,
.column-price {
    color: #1a2bc4 !important;
    font-weight: bold !important;
}

/* Order table text */
#result_list td {
    color: #ffffff !important;
}

/* Table headers */
#result_list th {
    color: #f5f5f5 !important;
    font-weight: bold;
}

/* Links (IDs, names, etc.) */
#result_list a {
    color: #4fc3f7 !important;
}

/* Alternate row color */
#result_list tr:nth-child(even) {
    background-color: #2c2c2c !important;
}
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">Organic Farm Admin</a></h1>
<div style="margin-top:6px;">
  <a href="{% url 'admin:database_design' %}" style="color:#f8f2e9; font-size:0.95rem; text-decoration:underline;">Database Design</a>
</div>
{% endblock %}
