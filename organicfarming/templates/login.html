{% extends 'nav.html' %}
{% load static %}

{% block content %}
<style>
    .login-page {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 70px);
        background: linear-gradient(135deg, #033603, #89b18c);
        padding: 20px;
    }

    .login-card {
        background: rgb(131, 148, 129);
        border-radius: 10px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        padding: 40px;
        width: 100%;
        max-width: 400px;
        animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .login-card h1 {
        text-align: center;
        color: #1b5e20;
        margin-bottom: 10px;
        font-size: 2rem;
    }

    .login-card p {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 0.9rem;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: bold;
        font-size: 0.95rem;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 5px;
        font-size: 1rem;
        transition: 0.3s;
        box-sizing: border-box;
    }

    .form-group input:focus {
        outline: none;
        border-color: #4caf50;
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
    }

    .remember-forgot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        font-size: 0.9rem;
    }

    .remember-forgot label {
        display: flex;
        align-items: center;
        margin: 0;
        cursor: pointer;
    }

    .remember-forgot input[type="checkbox"] {
        margin-right: 5px;
        cursor: pointer;
        width: auto;
        border: none;
    }

    .remember-forgot a {
        color: #4caf50;
        text-decoration: none;
        transition: 0.3s;
    }

    .remember-forgot a:hover {
        color: #2e7d32;
    }

    .login-card .login-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #4caf50, #2e7d32);
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .login-card .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(46, 125, 50, 0.4);
    }

    .error-message {
        background-color: #ffebee;
        color: #c62828;
        padding: 12px;
        border-radius: 5px;
        margin-bottom: 20px;
        display: none;
        border-left: 4px solid #c62828;
    }

    .success-message {
        background-color: #e8f5e9;
        color: #2e7d32;
        padding: 12px;
        border-radius: 5px;
        margin-bottom: 20px;
        display: none;
        border-left: 4px solid #2e7d32;
    }

    .signup-link {
        text-align: center;
        margin-top: 20px;
        color: #666;
    }

    .signup-link a {
        color: #4caf50;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
    }

    .signup-link a:hover {
        color: #2e7d32;
    }

    .logo-login {
        text-align: center;
        font-size: 3rem;
        margin-bottom: 10px;
    }
</style>

<div class="login-page">
    <div class="login-card">
        <div class="logo-login">🌿</div>
        <h1>Welcome Back</h1>
        <p>Login to your Organic Farm account</p>

        {% if messages %}
            {% for message in messages %}
                <div class="error-message" style="display: block;">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="{% url 'signup' %}">Sign Up Now</a>
        </div>
    </div>
</div>

{% endblock %}
